name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 直接清理根分区(/)上预装的大件来腾出空间。
    # 不要再用 easimon/maximize-build-space：它会缩小根分区并重建 LVM，
    # 在新版 runner(2.338.x) 上反而让根分区只剩 2GB，
    # 导致 Runner 连自身 _diag 日志都写不进去(No space left on device)而崩溃。
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/lib/jvm
        docker image prune --all --force || true

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    # 阿里云 ACR 个人版不认识 OCI 1.1 provenance attestation
    # (application/vnd.oci.empty.v1+json)：buildx 构建的镜像在源仓库是 OCI index，
    # 其中 unknown/unknown 的 attestation manifest 使用空 OCI config，
    # docker pull/tag/push 会把整个 index 原样推过去，ACR 在提交 manifest 时直接拒绝。
    # 改用 skopeo 做 registry -> registry 复制：默认只取单平台、不复制 attestation，
    # 并强制输出 Docker schema2(v2s2) manifest；镜像也不再落地到本地 Docker 存储。
    - name: Install skopeo
      run: |
        if ! command -v skopeo >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
        fi
        skopeo --version

    - name: Build and push image Aliyun
      run: |
        auth_file="$RUNNER_TEMP/skopeo-auth.json"
        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login --authfile "$auth_file" \
            -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # 把 --platform=linux/arm64[/v8] 转成 skopeo 选择平台的参数
            override_args=()
            if [ -n "$platform" ]; then
                p_os="${platform%%/*}"
                p_rest="${platform#*/}"
                p_arch="${p_rest%%/*}"
                override_args+=(--override-os "$p_os" --override-arch "$p_arch")
                if [ "$p_rest" != "$p_arch" ]; then
                    override_args+=(--override-variant "${p_rest#*/}")
                fi
            fi

            # 不带 --all：只复制单平台镜像，源 OCI index 中的 unknown/unknown
            # attestation manifest 不会被复制；--format v2s2 强制输出 Docker schema2。
            echo "skopeo copy docker://$image -> docker://$new_image"
            skopeo copy --dest-authfile "$auth_file" --format v2s2 \
                "${override_args[@]}" \
                "docker://$image" "docker://$new_image"

            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

        done < images.txt
